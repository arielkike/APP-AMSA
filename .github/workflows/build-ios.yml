name: 🍏 Build iOS App (iPhone)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: 📱 Compilar iOS en Servidor Mac
    runs-on: macos-14

    steps:
      - name: 🚚 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias NPM
        run: npm install

      - name: ⚡ Compilar proyecto web (Vite)
        run: npm run build

      - name: 🔄 Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: 🔨 Compilar proyecto con Xcode
        run: |
          if [ -d " ios/App/App.xcworkspace\ ]; then
 BUILD_TARGET=\-workspace ios/App/App.xcworkspace\
 else
 BUILD_TARGET=\-project ios/App/App.xcodeproj\
 fi
 
 xcodebuild \ \
 -scheme App \
 -configuration Release \
 -sdk iphoneos \
 -destination 'generic/platform=iOS' \
 -derivedDataPath build \
 CODE_SIGNING_ALLOWED=NO \
 CODE_SIGNING_REQUIRED=NO \
 CODE_SIGN_IDENTITY=\\ \
 clean build

 - name: 📦 Empaquetar app para descarga
 run: |
 mkdir -p output
 find build/Build/Products -name \*.app\ -exec cp -R {} output/ \;
 cd output && zip -r App-AMSA-iOS-Release.zip *.app

 - name: 📤 Subir archivo de iPhone a GitHub
 uses: actions/upload-artifact@v4
 with:
 name: App-AMSA-iOS-Release
 path: output/App-AMSA-iOS-Release.zip
 retention-days: 14
