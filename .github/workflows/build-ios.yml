name: Build iOS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build-ios:
    name: Compilar iOS en Mac
    runs-on: macos-14

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias NPM
        run: npm install

      - name: Compilar proyecto web
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Compilar proyecto iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build clean build

      - name: Empaquetar app para descarga
        run: |
          mkdir -p output
          find build/Build/Products -name "*.app" -exec cp -R {} output/ \;
          cd output && zip -r App-AMSA-iOS.zip *.app

      - name: Subir artefacto a GitHub
        uses: actions/upload-artifact@4
        with:
          name: App-AMSA-iOS
          path: output/App-AMSA-iOS.zip
          retention-days: 14
