name: 🍏 Build iOS App (iPhone)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: 📱 Compilar iOS en Servidor Mac
    runs-on: macos-14

    steps:
      - name: 🚚 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias NPM
        run: npm ci || npm install

      - name: ⚡ Compilar proyecto web (Vite)
        run: npm run build

      - name: 🔄 Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: 🥥 Instalar CocoaPods (si aplica)
        run: |
          if [ -f " ios/App/Podfile\ ]; then
 cd ios/App && pod install
 fi

 - name: 🔨 Compilar proyecto con Xcode
 run: |
 xcodebuild -workspace ios/App/App.xcworkspace \
 -scheme App \
 -configuration Release \
 -destination 'generic/platform=iOS' \
 -derivedDataPath build \
 CODE_SIGNING_ALLOWED=NO \
 clean build

 - name: 📦 Empaquetar app para descarga
 run: |
 mkdir -p output
 cp -R build/Build/Products/Release-iphoneos/App.app output/
 cd output && zip -r App-AMSA-iOS-Release.zip App.app

 - name: 📤 Subir archivo de iPhone a GitHub
 uses: actions/upload-artifact@v4
 with:
 name: App-AMSA-iOS-Release
 path: output/App-AMSA-iOS-Release.zip
 retention-days: 14
