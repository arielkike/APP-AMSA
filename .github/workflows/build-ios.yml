name: Build iOS App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Compilar iOS en Mac
    runs-on: macos-14

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Seleccionar Xcode 15.4 Estable
        run: |
          if [ -d '/Applications/Xcode_15.4.app' ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Instalar dependencias NPM
        run: npm install

      - name: Compilar proyecto web
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Resolver dependencias Swift Package Manager
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Compilar App iOS (Release)
        run: |
          xcodebuild -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGN_IDENTITY=''             CODE_SIGNING_REQUIRED=NO             SWIFT_STRICT_CONCURRENCY=minimal             -derivedDataPath build             clean build

      - name: Empaquetar IPA y APP
        run: |
          mkdir -p output/Payload
          find build/Build/Products -name 'App.app' -exec cp -R {} output/Payload/ \;
          cd output
          zip -r App-AMSA-iOS.ipa Payload
          find Payload -name 'App.app' -exec zip -r App-AMSA-iOS-App.zip {} \;

      - name: Subir artefacto a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: App-AMSA-iOS-Build
          path: |
            output/App-AMSA-iOS.ipa
            output/App-AMSA-iOS-App.zip
          retention-days: 14
